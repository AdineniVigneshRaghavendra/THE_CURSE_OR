<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>THE CURSE_OR</title>

        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <main class="game">
            <section class="header">
                <div class="header">
                    <div class="staus">
                        <span class="status-dot"></span>
                        SYSTEM ACTIVE
                    </div>

                    <h1>THE CURSE_OR</h1>

                    <P>
                        Navigate the maze without touching the walls.
                    </P>
                </div>
                <div id="maze">
                    <div id="fakeCursor"></div>

                    <div id="jumpscare">
                        <img src="jumpscare.png" alt="Jumpscare">

                    </div>
                    <button class="start">
                        START
                    </button>

                    <svg class="maze-lines"
                         viewBox="0 0 720 400"
                         preserveAspectRatio="none">
                        
                         <line class="wall" x1="60" y1="0" x2="60" y2="50"/>
                         <line class="wall" x1="60" y1="100" x2="60" y2="350"/>

                         <line class="wall" x1="120" y1="50" x2="120" y2="150"/>
                         <line class="wall" x1="120" y1="250" x2="120" y2="300"/>

                         <line class="wall" x1="180" y1="0" x2="180" y2="50"/>
                         <line class="wall" x1="180" y1="100" x2="180" y2="150"/>
                         <line class="wall" x1="180" y1="200" x2="180" y2="250"/>

                         <line class="wall" x1="240" y1="50" x2="240" y2="100"/>
                         <line class="wall" x1="240" y1="150" x2="240" y2="200"/>
                         <line class="wall" x1="240" y1="300" x2="240" y2="400"/>

                         <line class="wall" x1="300" y1="0" x2="300" y2="50"/>
                         <line class="wall" x1="300" y1="100" x2="300" y2="200"/>
                         <line class="wall" x1="300" y1="250" x2="300" y2="350"/>

                         <line class="wall" x1="360" y1="50" x2="360" y2="100"/>
                         <line class="wall" x1="360" y1="150" x2="360" y2="300"/>

                         <line class="wall" x1="420" y1="0" x2="420" y2="100"/>
                         <line class="wall" x1="420" y1="150" x2="420" y2="250"/>

                         <line class="wall" x1="480" y1="50" x2="480" y2="150"/>
                         <line class="wall" x1="480" y1="200" x2="480" y2="350"/>

                         <line class="wall" x1="540" y1="0" x2="540" y2="100"/>
                         <line class="wall" x1="540" y1="150" x2="540" y2="300"/>

                         <line class="wall" x1="600" y1="50" x2="600" y2="200"/>
                         <line class="wall" x1="600" y1="250" x2="600" y2="350"/>

                         <line class="wall" x1="660" y1="0" x2="660" y2="100"/>
                         <line class="wall" x1="660" y1="150" x2="660" y2="250"/>



                         <line class="wall" x1="0" y1="50" x2="60" y2="50"/>
                         <line class="wall" x1="120" y1="50" x2="180" y2="50"/>
                         <line class="wall" x1="240" y1="50" x2="360" y2="50"/>
                         <line class="wall" x1="420" y1="50" x2="480" y2="50"/>
                         <line class="wall" x1="540" y1="50" x2="660" y2="50"/>

                         <line class="wall" x1="60" y1="100" x2="180" y2="100"/>
                         <line class="wall" x1="240" y1="100" x2="300" y2="100"/>
                         <line class="wall" x1="360" y1="100" x2="480" y2="100"/>
                         <line class="wall" x1="540" y1="100" x2="600" y2="100"/>

                         <line class="wall" x1="0" y1="150" x2="120" y2="150"/>
                         <line class="wall" x1="180" y1="150" x2="240" y2="150"/>
                         <line class="wall" x1="300" y1="150" x2="420" y2="150"/>
                         <line class="wall" x1="480" y1="150" x2="540" y2="150"/>

                         <line class="wall" x1="60" y1="200" x2="180" y2="200"/>
                         <line class="wall" x1="240" y1="200" x2="360" y2="200"/>
                         <line class="wall" x1="420" y1="200" x2="600" y2="200"/>

                         <line class="wall" x1="0" y1="250" x2="120" y2="250"/>
                         <line class="wall" x1="180" y1="250" x2="300" y2="250"/>
                         <line class="wall" x1="360" y1="250" x2="480" y2="250"/>
                         <line class="wall" x1="540" y1="250" x2="660" y2="250"/>

                         <line class="wall" x1="60" y1="300" x2="240" y2="300"/>
                         <line class="wall" x1="300" y1="300" x2="420" y2="300"/>
                         <line class="wall" x1="480" y1="300" x2="600" y2="300"/>

                         <line class="wall" x1="0" y1="350" x2="60" y2="350"/>
                         <line class="wall" x1="120" y1="350" x2="240" y2="350"/>
                         <line class="wall" x1="300" y1="350" x2="480" y2="350"/>
                         <line class="wall" x1="540" y1="350" x2="660" y2="350"/>

   
                        </svg> 

                        <button class="exit">
                            EXIT
                        </button>
                </div>
                <div class="message-area">
                    <span class="message-label">
                        STATUS
                    </span>
                    <p id="message">
                        Click START to begin.
                    </p>
                </div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
